spring.application.name=ebank-bot
server.port=8058
spring.config.import=optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.reasoning-effort=low
spring.ai.openai.chat.options.extra-body.reasoning_format=hidden
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.max-retries=0
spring.ai.openai.chat.timeout=45s
spring.ai.mcp.client.streamable-http.connections.accounts.url=${ACCOUNT_MCP_URL:http://localhost:8056/mcp}
spring.ai.mcp.client.streamable-http.connections.transactions.url=${TRANSACTION_MCP_URL:http://localhost:8057/mcp}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.token=${TELEGRAM_TOKEN:}
eureka.client.jersey.enabled=false
