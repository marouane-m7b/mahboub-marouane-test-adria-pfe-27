spring.application.name=transaction-service
server.port=8057
spring.datasource.url=jdbc:h2:mem:transactions-db
spring.jpa.open-in-view=false
spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.graphql.graphiql.enabled=true
spring.cloud.openfeign.client.config.account-service.connect-timeout=2000
spring.cloud.openfeign.client.config.account-service.read-timeout=3000
resilience4j.circuitbreaker.instances.accounts.sliding-window-size=5
resilience4j.circuitbreaker.instances.accounts.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.accounts.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accounts.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accounts.ignore-exceptions=feign.FeignException$BadRequest,feign.FeignException$NotFound
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
